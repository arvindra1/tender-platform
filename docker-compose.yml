version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: indic_tender_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: indic_tenders
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indic_tender_webapp
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=indic_tenders
      - AUTO_FALLBACK_MOCK_DB=true
      - HOST=0.0.0.0
      - PORT=8000
      - SAFE_REQUEST_DELAY_SEC=1.5
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
    driver: local
